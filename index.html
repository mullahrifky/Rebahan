<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Kinerja Tim — BPS Kabupaten Mempawah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --color-bg: #F4F6F9;
      --color-surface: #FFFFFF;
      --color-primary: #12335F;
      --color-primary-light: #2C5490;
      --color-accent: #C08A3E;
      --color-success: #2F7A50;
      --color-warning: #B7791F;
      --color-danger: #C0392B;
      --color-text: #1B2430;
      --color-text-muted: #66748A;
      --color-border: #E2E7EE;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background: var(--color-bg);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #D3DAE3;
      border-radius: 4px;
    }

    button,
    select,
    input,
    textarea {
      font-family: var(--font-body);
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 1px;
    }

    a {
      color: inherit;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.topbar {
      background: var(--color-primary);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 12px;
      opacity: .75;
      letter-spacing: .2px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, .12);
      padding: 6px 8px 6px 14px;
      border-radius: 999px;
    }

    .user-pill .u-name {
      font-size: 13px;
      font-weight: 600;
    }

    .user-pill .u-role {
      font-size: 10.5px;
      opacity: .75;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .btn-switch {
      border: none;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-switch svg {
      width: 12px;
      height: 12px;
    }

    nav.tabs {
      display: flex;
      gap: 4px;
      padding: 0 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      overflow-x: auto;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 13px 14px;
      border: none;
      background: transparent;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      border-bottom: 2.5px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-accent);
    }

    .tab-btn svg {
      width: 16px;
      height: 16px;
    }

    main {
      flex: 1;
      padding: 22px 24px 60px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 4px;
    }

    .section-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--color-primary);
    }

    .section-desc {
      margin: 6px 0 0;
      color: var(--color-text-muted);
      font-size: 13.5px;
      max-width: 680px;
    }

    .section-head {
      margin-bottom: 18px;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 16px 18px;
      border-top: 3px solid var(--color-primary);
    }

    .stat-card.accent {
      border-top-color: var(--color-accent);
    }

    .stat-label {
      font-size: 12px;
      color: var(--color-text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: var(--color-primary);
      line-height: 1;
    }

    .stat-sub {
      font-size: 11.5px;
      color: var(--color-text-muted);
      margin-top: 6px;
    }

    .panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .panel-title {
      margin: 0;
      font-size: 14.5px;
      font-family: var(--font-display);
      color: var(--color-primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .badge svg {
      width: 12px;
      height: 12px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #EAEDF1;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--color-accent);
      border-radius: 999px;
      transition: width .3s ease;
    }

    .progress-fill.full {
      background: var(--color-success);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--color-border);
      background: #fff;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: #F2F4F7;
    }

    .icon-btn.danger {
      color: var(--color-danger);
    }

    .icon-btn.danger:hover {
      background: #FDECEC;
    }

    .icon-btn svg {
      width: 13px;
      height: 13px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      background: var(--color-primary);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(20, 40, 80, .15);
    }

    .btn-primary.small {
      padding: 6px 12px;
      font-size: 12.5px;
    }

    .btn-primary svg {
      width: 14px;
      height: 14px;
    }

    .btn-accent {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: var(--color-accent);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
    }

    .btn-accent svg {
      width: 13px;
      height: 13px;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: #fff;
      color: var(--color-text);
      font-size: 13.5px;
      font-weight: 600;
    }

    .btn-ghost.small {
      padding: 5px 10px;
      font-size: 12.5px;
    }

    .btn-ghost svg {
      width: 13px;
      height: 13px;
    }

    .field {
      display: block;
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 5px;
    }

    .field-label .req {
      color: var(--color-danger);
    }

    .input,
    select.input,
    textarea.input {
      width: 100%;
      padding: 8px 11px;
      border-radius: 7px;
      border: 1px solid var(--color-border);
      font-size: 13.5px;
      color: var(--color-text);
      background: #fff;
    }

    textarea.input {
      min-height: 64px;
      resize: vertical;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: 14px;
      color: var(--color-text-muted);
    }

    .empty-state svg {
      width: 30px;
      height: 30px;
      margin-bottom: 10px;
      opacity: .5;
    }

    .empty-title {
      font-family: var(--font-display);
      font-size: 17px;
      color: var(--color-text);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      max-width: 460px;
      margin: 0 auto;
    }

    .empty-row {
      font-size: 12.5px;
      color: var(--color-text-muted);
      font-style: italic;
    }

    .person-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: #FAFBFC;
      border: 1px solid var(--color-border);
      border-radius: 9px;
      margin-bottom: 8px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--color-primary-light);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .avatar.small {
      width: 26px;
      height: 26px;
      font-size: 11px;
    }

    .person-name {
      font-weight: 600;
      font-size: 13.5px;
    }

    .person-meta {
      font-size: 11.5px;
      color: var(--color-text-muted);
    }

    .tree-node {
      border: 1px solid var(--color-border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--color-surface);
      overflow: hidden;
    }

    .tree-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .tree-head svg.chev {
      width: 15px;
      height: 15px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .tree-label {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .level-tujuan>.tree-head {
      background: #EAF0F8;
    }

    .level-tujuan>.tree-head .tree-label {
      color: var(--color-primary);
      font-family: var(--font-display);
      font-size: 14.5px;
    }

    .level-sasaran>.tree-head .tree-label {
      color: var(--color-primary-light);
    }

    .level-iku>.tree-head .tree-label {
      color: var(--color-text);
      font-weight: 600;
    }

    .level-kegiatan>.tree-head {
      background: #FBFAF7;
    }

    .level-kegiatan>.tree-head .tree-label {
      color: var(--color-accent);
    }

    .tree-children {
      display: none;
      padding: 8px 10px 10px 26px;
    }

    .tree-children.open {
      display: block;
    }

    .count-chip {
      margin-left: auto;
      font-size: 11px;
      color: var(--color-text-muted);
      background: #F1F3F6;
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .subkeg-block {
      border-top: 1px dashed var(--color-border);
      padding: 10px 0;
    }

    .subkeg-block:first-child {
      border-top: none;
      padding-top: 2px;
    }

    .subkeg-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .subkeg-title .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-success);
      flex-shrink: 0;
    }

    .subkeg-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--color-text);
    }

    .aktivitas-card {
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-success);
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #FAFBFC;
    }

    .aktivitas-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .aktivitas-title {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .aktivitas-meta {
      font-size: 11.5px;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }

    .aktivitas-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }

    .aktivitas-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .assignee-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #EEF2F7;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }

    table.report {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    table.report thead tr {
      background: #F6F8FA;
      text-align: left;
    }

    table.report th {
      padding: 10px 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }

    table.report td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: top;
    }

    .report-wrap {
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: var(--color-surface);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, .45);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 5vh 16px;
      overflow-y: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
      overflow: hidden;
      margin-top: 12px;
    }

    .modal-box.wide {
      max-width: 580px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
    }

    .modal-head h3 {
      margin: 0;
      font-size: 16px;
      font-family: var(--font-display);
      color: var(--color-primary);
    }

    .modal-close {
      border: none;
      background: transparent;
      color: var(--color-text-muted);
    }

    .modal-close svg {
      width: 18px;
      height: 18px;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .modal-hint {
      font-size: 12px;
      color: var(--color-text-muted);
      background: #F4F6F9;
      border-radius: 8px;
      padding: 8px 11px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .modal-warn {
      font-size: 11.5px;
      color: var(--color-warning);
      margin-top: 4px;
    }

    .chip-select {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--color-border);
      background: #fff;
      color: var(--color-text);
      font-weight: 600;
    }

    .chip-select.active {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: #fff;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 4px;
    }

    .toggle-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .toggle-opt {
      flex: 1;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid var(--color-border);
      background: #fff;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      text-align: center;
    }

    .toggle-opt.active {
      border-color: var(--color-primary);
      background: #EAF0F8;
      color: var(--color-primary);
    }

    .login-wrap {
      max-width: 520px;
      margin: 8vh auto;
      padding: 0 20px;
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(20, 40, 80, .08);
    }

    .login-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .user-pick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .user-pick {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--color-border);
      border-radius: 9px;
      background: #fff;
      text-align: left;
    }

    .user-pick:hover {
      border-color: var(--color-primary);
    }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--color-text-muted);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .divider-text::before,
    .divider-text::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 440px;
      width: calc(100% - 32px);
      background: var(--color-danger);
      color: #fff;
      padding: 13px 16px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
      z-index: 200;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: toast-in .18s ease;
    }

    .toast.success {
      background: var(--color-success);
    }

    .toast svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .toast span {
      flex: 1;
      line-height: 1.4;
    }

    .toast-close {
      background: transparent;
      border: none;
      color: #fff;
      opacity: .85;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .toast-close svg {
      width: 14px;
      height: 14px;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translate(-50%, 10px)
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0)
      }
    }

    /* ---- Button loading states ---- */
    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .btn-loading {
      position: relative;
      pointer-events: none;
      opacity: .75;
    }

    .btn-loading::after {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .55s linear infinite;
      margin-left: 6px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .btn-ghost.btn-loading {
      opacity: .55;
    }

    .btn-ghost.btn-loading::after {
      border-color: rgba(0, 0, 0, .15);
      border-top-color: var(--color-primary);
    }

    .btn-accent.btn-loading::after {

<body>
  <div id="app"></div>
  <div id="toast-root"></div>
  <div id="print-piagam-root"></div>
  <script>
    const APPS_SCRIPT_URL = "Masukkan Script Google Spreadsheet disini";

    const TOKEN_KEY = "bps-kinerja-tim-token-v1";
    function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
    function saveToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { } }
    let TOKEN = loadToken();

    async function apiGet(action, extraParams) {
      const params = new URLSearchParams(Object.assign({ action, token: TOKEN || "" }, extraParams || {}));
      let res;
      try { res = await fetch(APPS_SCRIPT_URL + "?" + params.toString(), { method: "GET" }); }
      catch (networkErr) { console.error("apiGet network error:", networkErr); throw new Error("Tidak dapat menghubungi server. Periksa koneksi internet dan APPS_SCRIPT_URL."); }
      let data;
      try { data = await res.json(); }
      catch (parseErr) { console.error("apiGet: respons bukan JSON. Status:", res.status, "Action:", action); throw new Error("Respons server tidak valid (status " + res.status + "). Cek pengaturan Deploy (Who has access: Anyone) dan gunakan versi deployment terbaru."); }
      if (data && data.error) { console.error("apiGet error dari server:", action, data.error); throw new Error(data.error); }
      return data;
    }
    async function apiPost(action, payload) {
      const hasFileData = payload && (payload.buktiFileBase64);
      const data = Object.assign({ action, token: TOKEN || "" }, payload || {});
      if (hasFileData) {
        let res;
        try {
          res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data),
            redirect: "follow",
          });
        } catch (networkErr) { console.error("apiPost (file) network error:", networkErr); throw new Error("Tidak dapat menghubungi server. Periksa koneksi internet dan APPS_SCRIPT_URL."); }
        let json;
        try { json = await res.json(); }
        catch (parseErr) {
          const params2 = new URLSearchParams();
          for (const [k, v] of Object.entries(data)) {
            if (v !== undefined && v !== null && k !== "buktiFileBase64") params2.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
          }
          try {
            res = await fetch(APPS_SCRIPT_URL + "?" + params2.toString(), { method: "GET" });
            json = await res.json();
          } catch (retryErr) { throw new Error("Respons server tidak valid. Cek pengaturan Deploy (Who has access: Anyone)."); }
        }
        if (json && json.error) { console.error("apiPost error:", action, json.error); throw new Error(json.error); }
        return json;
      }
      const params = new URLSearchParams();
      for (const [k, v] of Object.entries(data)) {
        if (v !== undefined && v !== null) params.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
      }
      let res;
      try {
        res = await fetch(APPS_SCRIPT_URL + "?" + params.toString(), { method: "GET" });
      } catch (networkErr) { console.error("apiPost network error:", networkErr); throw new Error("Tidak dapat menghubungi server. Periksa koneksi internet dan APPS_SCRIPT_URL."); }
      let json;
      try { json = await res.json(); }
      catch (parseErr) { console.error("apiPost: respons bukan JSON. Status:", res.status, "Action:", action); throw new Error("Respons server tidak valid (status " + res.status + "). Cek pengaturan Deploy (Who has access: Anyone) dan gunakan versi deployment terbaru."); }
      if (json && json.error) { console.error("apiPost error dari server:", action, json.error); throw new Error(json.error); }
      return json;
    }
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function todayStr() {
      const dt = new Date();
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    }
    function currentMonthStr() {
      return todayStr().slice(0, 7);
    }

    let REFERENSI = [];
    let DATA = { users: [], aktivitas: [], laporan: [], penilaian: [], pengajuan: [] };
    let CURRENT_USER = null;
    const _eotmCache = {};
    function clearEotmCache() { for (const k in _eotmCache) delete _eotmCache[k]; }

    let STATE = { 
      tab: "dashboard", 
      expandedTree: {}, 
      searchTree: "", 
      filterAktivitas: "all", 
      filterPegawai: "all", 
      filterRekapBulan: "all",
      filterDariTanggal: "", 
      filterSampaiTanggal: "",
      loginMode: "login",
      filterBulan: currentMonthStr(),
      eotmBulan: currentMonthStr()
    };

    async function refreshAll() {
      const res = await apiGet("refresh");
      DATA = res;
      clearEotmCache();
    }

    function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
    function esc(str) { return String(str == null ? "" : str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
    function icon(name, extra) { return `<i data-lucide="${name}" ${extra || ""}></i>`; }

    /* ==========================================================
       NILAI KINERJA NUMERIK (0–100)
       - Nilai lama yang masih kategorik dikonversi otomatis saat ditampilkan.
       - Skor Akhir = 60% Nilai Kinerja + 40% Indeks BerAKHLAK (dinormalisasi ke 0–100).
       ========================================================== */
    const KINERJA_LEGACY_MAP = { "sangat baik": 95, "baik": 85, "cukup baik": 70, "tidak baik": 50 };
    const BOBOT_KINERJA = 0.6;
    const BOBOT_BERAKHLAK = 0.4;

    /** Konversi nilai kinerja (numerik atau kategorik lama) ke angka bulat 0–100. */
    function kinerjaNum(v) {
      if (v === null || v === undefined || v === "") return 0;
      const n = Number(v);
      if (!isNaN(n)) return Math.max(0, Math.min(100, Math.round(n)));
      return KINERJA_LEGACY_MAP[String(v).trim().toLowerCase()] || 0;
    }
    /** True jika nilai tersimpan masih berupa kategori lama. */
    function isKinerjaLegacy(v) {
      return v !== null && v !== undefined && v !== "" && isNaN(Number(v));
    }
    /** Predikat berdasarkan nilai numerik. */
    function kinerjaPredikat(n) {
      n = Number(n) || 0;
      if (n >= 91) return { label: "Sangat Baik", color: "var(--color-success)", bg: "#E7F4EC" };
      if (n >= 76) return { label: "Baik", color: "#1E40AF", bg: "#DBEAFE" };
      if (n >= 61) return { label: "Cukup", color: "var(--color-warning)", bg: "#FBF1E1" };
      if (n >= 51) return { label: "Kurang", color: "#C2410C", bg: "#FFEDD5" };
      return { label: "Sangat Kurang", color: "var(--color-danger)", bg: "#FDECEC" };
    }
    function kinerjaBadge(v, extraStyle) {
      const n = kinerjaNum(v);
      const p = kinerjaPredikat(n);
      return `<span class="badge" style="background:${p.bg};color:${p.color};${extraStyle || ""}">${n} <span style="font-weight:500;opacity:.8">· ${p.label}</span></span>`;
    }
    /** Rata-rata 7 nilai BerAKHLAK (skala 1–5). */
    function berakhlakAvg(p) {
      const keys = ["berorientasiPelayanan", "akuntabel", "kompeten", "harmonis", "loyal", "adaptif", "kolaboratif"];
      return keys.reduce((s, k) => s + (Number(p[k]) || 0), 0) / keys.length;
    }
    /** Skor Akhir 0–100 (1 desimal). */
    function skorAkhir(p) {
      const kin = kinerjaNum(p.nilaiKinerja);
      const ber = (berakhlakAvg(p) / 5) * 100;
      return Math.round((kin * BOBOT_KINERJA + ber * BOBOT_BERAKHLAK) * 10) / 10;
    }

    let __toastTimer = null;
    function showToast(message, type) {
      const root = document.getElementById("toast-root");
      if (!root) return;
      const isError = type === "error" || (!type);
      root.innerHTML = `<div class="toast ${isError ? '' : 'success'}">
    ${icon(isError ? 'alert-triangle' : 'check-circle-2')}
    <span>${esc(message)}</span>
    <button class="toast-close" data-action="dismiss-toast">${icon('x')}</button>
  </div>`;
      if (window.lucide) lucide.createIcons();
      clearTimeout(__toastTimer);
      __toastTimer = setTimeout(() => { if (root) root.innerHTML = ""; }, 4000);
    }
    function fmtDate(d) { if (!d) return "\u2014"; const dt = new Date(d + "T00:00:00"); if (isNaN(dt)) return d; return dt.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }); }
    function fmtMonth(m) {
      if (!m) return "";
      const [year, month] = m.split("-");
      const names = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const mIdx = parseInt(month, 10) - 1;
      return (names[mIdx] || month) + " " + year;
    }
    function progressBar(value) {
      const v = Math.max(0, Math.min(100, Number(value) || 0));
      return `<div class="progress-track"><div class="progress-fill ${v >= 100 ? "full" : ""}" style="width:${v}%"></div></div>`;
    }
    function statusMeta(pct) {
      if (pct <= 0) return { label: "Belum Mulai", icon: "circle", color: "var(--color-text-muted)", bg: "#F1F3F6" };
      if (pct >= 100) return { label: "Selesai", icon: "circle-check-big", color: "var(--color-success)", bg: "#E7F4EC" };
      return { label: "Berjalan", icon: "circle-dot", color: "var(--color-accent)", bg: "#FBF1E1" };
    }
    function statusBadge(pct) {
      const s = statusMeta(pct);
      return `<span class="badge" style="color:${s.color};background:${s.bg}">${icon(s.icon)} ${s.label}</span>`;
    }
    function computeProgress(aktivitasId) {
      const akt = DATA.aktivitas.find(a => a.id === aktivitasId);
      if (!akt) return { sum: 0, percent: 0 };
      const sum = DATA.laporan.filter(l => l.aktivitasId === aktivitasId).reduce((s, l) => s + (Number(l.capaian) || 0), 0);
      const target = Number(akt.target) || 0;
      const percent = target > 0 ? Math.min(100, Math.round((sum / target) * 100)) : 0;
      return { sum, percent };
    }

        const unassigned = DATA.aktivitas.filter(a => !a.assignedTo || a.assignedTo.length === 0);

          ? `<div style="padding:24px 0;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
               <div style="color:var(--color-success);font-size:28px;line-height:1">✅</div>
               <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-success)">Semua aktivitas sudah ditugaskan!</div>
             </div>`
          : unassigned.slice(0, 5).map(a => `
              <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border)">
                <div style="flex-shrink:0;color:var(--color-danger)">${icon("triangle-alert")}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.nama)}">${esc(a.nama)}</div>
                  <div style="font-size:11px;color:var(--color-text-muted)">${esc(a.satuan || "")} &middot; target: ${a.target || "—"}</div>
                </div>
                <button class="btn-ghost" style="font-size:11px;padding:4px 10px;flex-shrink:0" data-action="set-tab" data-id="aktivitas">${icon("user-plus")} Tugaskan</button>
              </div>`).join("") +
            (unassigned.length > 5 ? `<div style="font-size:12px;color:var(--color-text-muted);text-align:center;padding-top:10px">+${unassigned.length - 5} aktivitas lainnya belum ditugaskan</div>` : "");

        const unassignedBadge = unassigned.length > 0
          ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#FEE2E2;color:#991B1B">${unassigned.length} belum ditugaskan</span>`
          : `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#D1FAE5;color:#065F46">Semua tertugaskan ✓</span>`;

        const nowMonth = currentMonthStr();
        const alreadyRated = new Set((DATA.penilaian || []).filter(p => p.bulan === nowMonth).map(p => p.pegawaiId));
        const submitted = (DATA.pengajuan || []).filter(p => p.bulan === nowMonth && p.status === "diajukan").map(p => p.pegawaiId);
        const waitingRating = submitted.filter(id => !alreadyRated.has(id));
        const waitingUsers = waitingRating.map(id => DATA.users.find(u => u.id === id)).filter(u => u && u.role === "pegawai");

        const waitingHtml = waitingUsers.length === 0
          ? `<div style="padding:24px 0;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
               <div style="color:var(--color-primary);font-size:28px;line-height:1">🏅</div>
               <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-text-muted)">Tidak ada laporan yang menunggu penilaian.</div>
             </div>`
          : waitingUsers.slice(0, 5).map(u => `
              <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border)">
                <div class="avatar" style="background:var(--color-accent);width:34px;height:34px;font-size:14px;font-weight:700;flex-shrink:0">${esc(u.nama.slice(0,1).toUpperCase())}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:12.5px;font-weight:600">${esc(u.nama)}</div>
                  <div style="font-size:11px;color:var(--color-text-muted)">Laporan ${fmtMonth(nowMonth)} sudah dikunci &middot; menunggu penilaian</div>
                </div>
                <button class="btn-ghost" style="font-size:11px;padding:4px 10px;flex-shrink:0" data-action="set-tab" data-id="penilaian">${icon("award")} Nilai</button>
              </div>`).join("") +
            (waitingUsers.length > 5 ? `<div style="font-size:12px;color:var(--color-text-muted);text-align:center;padding-top:10px">+${waitingUsers.length - 5} pegawai lainnya menunggu penilaian</div>` : "");

        const waitingBadge = waitingUsers.length > 0
          ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#FEF3C7;color:#92400E">${waitingUsers.length} menunggu penilaian</span>`
          : `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#D1FAE5;color:#065F46">Semua sudah dinilai ✓</span>`;

        ketuaWidgets = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px" class="dash-grid-action">
            <div class="panel" style="border-left:4px solid var(--color-danger)">
              <div class="panel-head" style="display:flex;justify-content:space-between;align-items:center">
                <h3 class="panel-title">${icon("user-plus")} Aktivitas Belum Ditugaskan</h3>
                ${unassignedBadge}
              </div>
              ${unassignedHtml}
            </div>
            <div class="panel" style="border-left:4px solid var(--color-warning)">
              <div class="panel-head" style="display:flex;justify-content:space-between;align-items:center">
                <h3 class="panel-title">${icon("award")} Menunggu Penilaian</h3>
                ${waitingBadge}
              </div>
              ${waitingHtml}
            </div>
          </div>
          <style>@media(max-width:900px){.dash-grid-action{grid-template-columns:1fr !important}}</style>`;
      }

      /* ── Penilai: pending review widget ── */
      let penilaiWidget = "";
      if (isPenilai) {
        const nowMonth = currentMonthStr();
        const alreadyRated = new Set((DATA.penilaian || []).filter(p => p.bulan === nowMonth).map(p => p.pegawaiId));
        const submitted = (DATA.pengajuan || []).filter(p => p.bulan === nowMonth && p.status === "diajukan").map(p => p.pegawaiId);
        const waitingRating = submitted.filter(id => !alreadyRated.has(id));
        const waitingUsers = waitingRating.map(id => DATA.users.find(u => u.id === id)).filter(u => u && u.role === "pegawai");

        const waitingHtml = waitingUsers.length === 0
          ? `<div style="padding:24px 0;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
               <div style="color:var(--color-primary);font-size:32px;line-height:1">🏅</div>
               <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-success)">Tidak ada laporan yang menunggu penilaian Anda.</div>
             </div>`
          : waitingUsers.map(u => `
              <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border)">
                <div class="avatar" style="background:var(--color-accent);width:34px;height:34px;font-size:14px;font-weight:700;flex-shrink:0">${esc(u.nama.slice(0,1).toUpperCase())}</div>
                <div style="flex:1">
                  <div style="font-size:13px;font-weight:600">${esc(u.nama)}</div>
                  <div style="font-size:11px;color:var(--color-text-muted)">Laporan ${fmtMonth(nowMonth)} sudah dikunci &middot; menunggu penilaian</div>
                </div>
                <button class="btn-primary" style="font-size:11px;padding:5px 12px;flex-shrink:0" data-action="set-tab" data-id="penilaian">${icon("award")} Nilai Sekarang</button>
              </div>`).join("");

        penilaiWidget = `
          <div class="panel" style="border-left:4px solid var(--color-warning);margin-bottom:20px">
            <div class="panel-head" style="display:flex;justify-content:space-between;align-items:center">
              <h3 class="panel-title">${icon("award")} Laporan Menunggu Penilaian Anda</h3>
              ${waitingUsers.length > 0 ? `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#FEF3C7;color:#92400E">${waitingUsers.length} laporan</span>` : ""}
            </div>
            ${waitingHtml}
          </div>`;
      }

      /* ── Bottom panels (attention + contribution) — shown for ketua/admin/penilai ── */
      const pegawaiStats = DATA.users.filter(u => u.role === "pegawai").map(u => {
        const laps = DATA.laporan.filter(l => l.pegawaiId === u.id);
        const total = laps.reduce((s, l) => s + (Number(l.capaian) || 0), 0);
        return { u, count: laps.length, total };
      }).sort((a, b) => b.total - a.total);

      const perluPerhatian = DATA.aktivitas.map(a => ({ a, ...computeProgress(a.id) }))
        .filter(x => x.percent < 100)
        .sort((a, b) => a.percent - b.percent)
        .slice(0, 6);

      const bottomPanels = (isKetua || isPenilai) ? `
        <div style="display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start" class="dash-grid">
          <div class="panel">
            <div class="panel-head"><h3 class="panel-title">Aktivitas Perlu Perhatian</h3></div>
            ${perluPerhatian.length === 0 ? `<div class="empty-row">Semua aktivitas sudah mencapai 100%.</div>` :
              perluPerhatian.map(x => `
              <div style="margin-bottom:13px">
                <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:12.5px;gap:8px">
                  <span style="font-weight:600">${esc(x.a.nama)}</span>
                  <span style="color:var(--color-text-muted);flex-shrink:0">${x.percent}%</span>
                </div>
                ${progressBar(x.percent)}
              </div>`).join("")}
          </div>
          <div class="panel">
            <div class="panel-head"><h3 class="panel-title">Kontribusi Pegawai</h3></div>
            ${pegawaiStats.length === 0 ? `<div class="empty-row">Belum ada pegawai.</div>` :
              pegawaiStats.map(x => `
              <div class="person-row">
                <div style="display:flex;align-items:center;gap:10px">
                  <div class="avatar">${esc(x.u.nama.slice(0, 1).toUpperCase())}</div>
                  <div><div class="person-name">${esc(x.u.nama)}</div><div class="person-meta">${x.count} laporan</div></div>
                </div>
                <div style="font-weight:700;color:var(--color-primary);font-size:13px">${x.total}</div>
              </div>`).join("")}
          </div>
        </div>
        <style>@media(max-width:900px){.dash-grid{grid-template-columns:1fr !important}}</style>` : "";

      return `
        ${sectionHead("Ringkasan", "Dasbor Kinerja")}
        ${statsHtml}
        ${myTasksWidget}
        ${ketuaWidgets}
        ${penilaiWidget}
        ${bottomPanels}
      `;
    }

    function filterTree(query) {
      const q = query.toLowerCase();
      return REFERENSI.map(t => {
        const sasaran = t.sasaran.map(s => {
          const iku = s.iku.map(i => {
            const kegiatan = i.kegiatan.filter(k =>
              k.nama.toLowerCase().includes(q) ||
              k.subKegiatan.some(sk => sk.toLowerCase().includes(q)) ||
              i.nama.toLowerCase().includes(q) || s.nama.toLowerCase().includes(q) || t.nama.toLowerCase().includes(q)
            );
            return { ...i, kegiatan };
          }).filter(i => i.kegiatan.length > 0);
          return { ...s, iku };
        }).filter(s => s.iku.length > 0);
        return { ...t, sasaran };
      }).filter(t => t.sasaran.length > 0);
    }

    function renderAktivitasTab() {
      const isKetua = CURRENT_USER.role === "ketua_tim" || CURRENT_USER.role === "admin";
      const q = STATE.searchTree.trim();
      const tree = q ? filterTree(q) : REFERENSI;
      const forceOpen = !!q;

      const body = tree.length === 0
        ? emptyState("Tidak ditemukan", "Tidak ada Kegiatan atau Sub Kegiatan yang cocok dengan pencarian.")
        : tree.map((t, ti) => renderTujuanNode(t, `t${ti}`, forceOpen, isKetua)).join("");

      return `
    ${sectionHead("Rencana Kerja", "Tujuan, Sasaran, IKU, Kegiatan & Sub Kegiatan", "Struktur ini mengikuti dokumen rencana kinerja resmi. " + (isKetua ? "Buka hingga Sub Kegiatan untuk menambahkan Aktivitas dan menentukan targetnya." : "Buka hingga Sub Kegiatan untuk melihat aktivitas yang ditugaskan kepada Anda."))}
    <div class="field" style="max-width:420px">
      <input class="input" id="tree-search" placeholder="Cari kegiatan atau sub kegiatan\u2026" value="${esc(STATE.searchTree)}">
    </div>
    <div>${body}</div>
  `;
    }

    function renderTujuanNode(t, path, forceOpen, isKetua) {
      const open = forceOpen || !!STATE.expandedTree[path];
      return `<div class="tree-node level-tujuan">
    <div class="tree-head" data-action="toggle-tree" data-id="${path}">
      ${icon(open ? "chevron-down" : "chevron-right", 'class="chev"')}
      <span class="tree-label">${esc(t.nama)}</span>
    </div>
    <div class="tree-children ${open ? "open" : ""}" id="tc-${path}">
      ${t.sasaran.map((s, si) => renderSasaranNode(s, `${path}-s${si}`, forceOpen, isKetua)).join("")}
    </div>
  </div>`;
    }
    function renderSasaranNode(s, path, forceOpen, isKetua) {
      const open = forceOpen || !!STATE.expandedTree[path];
      return `<div class="tree-node level-sasaran">
    <div class="tree-head" data-action="toggle-tree" data-id="${path}">
      ${icon(open ? "chevron-down" : "chevron-right", 'class="chev"')}
      <span class="tree-label">${esc(s.nama)}</span>
    </div>
    <div class="tree-children ${open ? "open" : ""}" id="tc-${path}">
      ${s.iku.map((i, ii) => renderIkuNode(i, `${path}-i${ii}`, forceOpen, isKetua)).join("")}
    </div>
  </div>`;
    }
    function renderIkuNode(i, path, forceOpen, isKetua) {
      const open = forceOpen || !!STATE.expandedTree[path];
      return `<div class="tree-node level-iku">
    <div class="tree-head" data-action="toggle-tree" data-id="${path}">
      ${icon(open ? "chevron-down" : "chevron-right", 'class="chev"')}
      <span class="tree-label">${esc(i.nama)}</span>
    </div>
    <div class="tree-children ${open ? "open" : ""}" id="tc-${path}">
      ${i.kegiatan.map((k, ki) => renderKegiatanNode(i, k, `${path}-k${ki}`, forceOpen, isKetua)).join("")}
    </div>
  </div>`;
    }
    function isVisibleAktivitasForUser(a) {
      if (CURRENT_USER.role === "pegawai") {
        return (a.assignedTo || []).includes(CURRENT_USER.id);
      }
      return true;
    }
    function renderKegiatanNode(iParent, k, path, forceOpen, isKetua) {
      const open = forceOpen || !!STATE.expandedTree[path];
      const totalAkt = k.subKegiatan.reduce((sum, sk) => sum + DATA.aktivitas.filter(a => a.kegiatan === k.nama && a.subKegiatan === sk && (!a.iku || a.iku === iParent.nama) && isVisibleAktivitasForUser(a)).length, 0);
      return `<div class="tree-node level-kegiatan">
    <div class="tree-head" data-action="toggle-tree" data-id="${path}">
      ${icon(open ? "chevron-down" : "chevron-right", 'class="chev"')}
      <span class="tree-label">${esc(k.nama)}</span>
      <span class="count-chip">${totalAkt} aktivitas</span>
    </div>
    <div class="tree-children ${open ? "open" : ""}" id="tc-${path}">
      ${k.subKegiatan.map(sk => renderSubKegiatanBlock(iParent, k, sk, isKetua)).join("")}
    </div>
  </div>`;
    }
    function renderSubKegiatanBlock(iParent, k, sk, isKetua) {
      const list = DATA.aktivitas.filter(a => a.kegiatan === k.nama && a.subKegiatan === sk && (!a.iku || !iParent || a.iku === iParent.nama) && isVisibleAktivitasForUser(a));
      return `<div class="subkeg-block">
    <div class="subkeg-title">
      <span class="dot"></span><span class="subkeg-name">${esc(sk)}</span>
      ${isKetua ? `<button class="btn-accent" style="margin-left:auto" data-action="open-aktivitas-add"
          data-tujuan="${esc(k.__tujuan || "")}" data-sasaran="${esc(k.__sasaran || "")}" data-iku="${esc(k.__iku || "")}"
          data-kegiatan="${esc(k.nama)}" data-subkegiatan="${esc(sk)}">${icon("plus")} Tambah Aktivitas</button>` : ""}
    </div>
    ${list.length === 0
          ? `<div class="empty-row">${isKetua ? "Belum ada aktivitas pada sub kegiatan ini." : "Tidak ada aktivitas yang ditugaskan kepada Anda pada sub kegiatan ini."}</div>`
          : list.map(a => renderAktivitasCard(a, isKetua)).join("")}
  </div>`;
    }
    function renderAktivitasCard(a, isKetua) {
      const { sum, percent } = computeProgress(a.id);
      const assignees = (a.assignedTo || []).map(id => userName(id));
      const canLapor = CURRENT_USER.role === "pegawai" && (a.assignedTo || []).includes(CURRENT_USER.id);
      return `<div class="aktivitas-card">
    <div class="aktivitas-top">
      <div>
        <div class="aktivitas-title">${esc(a.nama)}</div>
        <div class="aktivitas-meta">Target: ${esc(a.target)} ${esc(a.satuan || "")} &middot; Periode: ${fmtDate(a.periodeMulai)} \u2013 ${fmtDate(a.periodeSelesai)}</div>
      </div>
      <div class="aktivitas-actions">
        ${canLapor ? `<button class="btn-accent" data-action="open-lapor-add" data-aktivitas="${a.id}">${icon("pencil-line")} Lapor</button>` : ""}
        ${isKetua ? `<button class="icon-btn" title="Ubah" data-action="open-aktivitas-edit" data-id="${a.id}">${icon("pencil")}</button>
                    <button class="icon-btn danger" title="Hapus" data-action="delete-aktivitas" data-id="${a.id}">${icon("trash-2")}</button>` : ""}
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
      ${assignees.length ? assignees.map(n => `<span class="assignee-chip">${icon('user-round')} ${esc(n)}</span>`).join("") : `<span class="empty-row">Belum ditugaskan ke pegawai</span>`}
    </div>
    <div class="aktivitas-controls">
      ${statusBadge(percent)}
      <div style="display:flex;align-items:center;gap:6px;min-width:160px;flex:1">
        <div style="flex:1">${progressBar(percent)}</div>
        <span style="font-size:11.5px;color:var(--color-text-muted);white-space:nowrap">${sum}/${a.target} (${percent}%)</span>
      </div>
    </div>
  </div>`;
    }

    function renderLaporTab() {
      if (!STATE.laporBulan) {
        STATE.laporBulan = currentMonthStr();
      }
      const selBulan = STATE.laporBulan;
      const isSubmitted = (DATA.pengajuan || []).some(p => p.pegawaiId === CURRENT_USER.id && p.bulan === selBulan && p.status === "diajukan");

      const myAktivitas = DATA.aktivitas.filter(a => (a.assignedTo || []).includes(CURRENT_USER.id));
      const myLaporan = DATA.laporan.filter(l => l.pegawaiId === CURRENT_USER.id && String(l.tanggal).slice(0, 7) === selBulan).sort((a, b) => b.tanggal.localeCompare(a.tanggal) || b.createdAt - a.createdAt);

      let formBlock = "";
      if (myAktivitas.length === 0) {
        formBlock = emptyState("Belum ada aktivitas ditugaskan", "Hubungi Ketua Tim agar Anda ditugaskan ke sebuah aktivitas terlebih dahulu.");
      } else if (isSubmitted) {
        const hasPenilaian = (DATA.penilaian || []).some(p => p.pegawaiId === CURRENT_USER.id && p.bulan === selBulan);
        const cancelBtn = !hasPenilaian
          ? `<button class="btn-ghost small" style="color:var(--color-danger);border-color:var(--color-danger);background:transparent" data-action="cancel-my-pengajuan" data-bulan="${selBulan}">${icon("unlock")} Batalkan Pengajuan</button>`
          : "";
        formBlock = `
          <div class="panel" style="margin-bottom:18px;background:#F0F9FF;border-left:4px solid var(--color-primary-light);display:flex;align-items:center;justify-content:space-between;padding:16px;flex-wrap:wrap;gap:12px">
            <div>
              <h4 style="margin:0 0 4px;color:var(--color-primary);font-size:14.5px;font-family:var(--font-display);display:flex;align-items:center;gap:6px">${icon("lock", 'style="width:16px;height:16px"')} Laporan Terkunci</h4>
              <p style="margin:0;font-size:12.5px;color:var(--color-text-muted)">Laporan Anda untuk bulan ${fmtMonth(selBulan)} telah dikunci dan diajukan ke Penilai. ${hasPenilaian ? "Laporan ini telah dinilai oleh Penilai." : "Anda dapat membatalkan pengajuan ini selama belum dinilai."}</p>
            </div>
            ${cancelBtn}
          </div>
        `;
      } else {
        formBlock = `
          <div class="panel" style="margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div>
              <h4 style="margin:0 0 4px;font-size:14.5px;font-family:var(--font-display)">📝 Kelola Laporan Bulanan</h4>
              <p style="margin:0;font-size:12.5px;color:var(--color-text-muted)">Silakan tambahkan semua laporan harian Anda untuk bulan ${fmtMonth(selBulan)}. Setelah selesai, silakan ajukan laporan.</p>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn-primary" data-action="open-lapor-add" data-aktivitas="">${icon("plus")} Buat Laporan Baru</button>
              <button class="btn-accent" data-action="submit-lapor-bulan" data-bulan="${selBulan}">${icon("lock")} Kunci &amp; Ajukan Laporan</button>
            </div>
          </div>
        `;
      }

      const historyBlock = myLaporan.length === 0
        ? emptyState("Belum ada riwayat laporan", `Tidak ada riwayat laporan harian untuk bulan ${fmtMonth(selBulan)}.`)
        : `<div class="report-wrap"><table class="report">
        <thead><tr><th>Tanggal</th><th>Aktivitas</th><th>Uraian</th><th>Capaian</th><th>Bukti Dukung</th>${isSubmitted ? "" : "<th></th>"}</tr></thead>
        <tbody>
          ${myLaporan.map(l => {
          const akt = DATA.aktivitas.find(a => a.id === l.aktivitasId);
          return `<tr>
              <td style="white-space:nowrap">${fmtDate(l.tanggal)}</td>
              <td style="max-width:180px">${akt ? esc(akt.nama) : "<em>(dihapus)</em>"}</td>
              <td style="max-width:240px">${esc(l.uraian)}</td>
              <td>${l.capaian} ${akt ? esc(akt.satuan || "") : ""}</td>
              <td>${renderBuktiLink(l)}</td>
              ${isSubmitted ? "" : `<td><div style="display:flex;gap:4px">
                <button class="icon-btn" title="Ubah" data-action="open-lapor-edit" data-id="${l.id}">${icon("pencil")}</button>

      </div>`;

    function expandMonthsBetween(startDateStr, endDateStr) {
      const m1 = String(startDateStr || "").slice(0, 7);
      const m2 = String(endDateStr || "").slice(0, 7);
      if (!/^\d{4}-\d{2}$/.test(m1)) return /^\d{4}-\d{2}$/.test(m2) ? [m2] : [];
      if (!/^\d{4}-\d{2}$/.test(m2) || m2 < m1) return [m1];
      const res = [];
      let [y, m] = m1.split("-").map(Number);
      const [ey, em] = m2.split("-").map(Number);
      let guard = 0;
      while ((y < ey || (y === ey && m <= em)) && guard < 36) {
        res.push(`${y}-${String(m).padStart(2, "0")}`);
        m++;
        if (m > 12) { m = 1; y++; }
        guard++;
      }
      return res;
    }

    function getMonthsForAktivitas(a, laporanPool) {
      const months = new Set();
      expandMonthsBetween(a.periodeMulai, a.periodeSelesai).forEach(m => months.add(m));
      (laporanPool || []).forEach(l => {
        if (l.aktivitasId === a.id) {
          const m = String(l.tanggal || "").slice(0, 7);
          if (/^\d{4}-\d{2}$/.test(m)) months.add(m);
        }
      });
      if (months.size === 0) months.add(currentMonthStr());
      return Array.from(months).sort((x, y) => y.localeCompare(x));
    }

      // Kumpulkan seluruh bulan yang tersedia dari aktivitas & laporan

    // --- Employee of the Month logic & components ---
    function getWinnerForMonth(targetMonth) {
      const listPenilaian = (DATA.penilaian || []).filter(p => p.bulan === targetMonth);
      if (listPenilaian.length === 0) return null;
      
      const candidates = listPenilaian.map(p => {
        const u = DATA.users.find(usr => usr.id === p.pegawaiId);
        if (!u) return null;
        
        // Skor Akhir (0–100) = 60% Nilai Kinerja + 40% Indeks BerAKHLAK (dinormalisasi ke 0–100)
        const totalScore = skorAkhir(p);
        
        const reports = (DATA.laporan || []).filter(l => l.pegawaiId === p.pegawaiId && String(l.tanggal).slice(0, 7) === targetMonth);
        const reportCount = reports.length;
        
        const earliestReport = reports.length > 0 ? Math.min(...reports.map(l => Number(l.createdAt) || Infinity)) : Infinity;
        
        return {
          pegawaiId: p.pegawaiId,
          user: u,
          penilaian: p,
          score: totalScore,
          reportCount: reportCount,
          earliestReport: earliestReport,
          prevWins: 0,
          randomVal: 0
        };
      }).filter(Boolean);
      
      if (candidates.length === 0) return null;
      
      candidates.forEach(cand => {
        cand.prevWins = getPrevWinsCount(cand.pegawaiId, targetMonth);
        cand.randomVal = getDeterministicRandom(cand.pegawaiId, targetMonth);
      });
      
      candidates.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        if (b.reportCount !== a.reportCount) return b.reportCount - a.reportCount;
        if (a.earliestReport !== b.earliestReport) return a.earliestReport - b.earliestReport;
        if (a.prevWins !== b.prevWins) return a.prevWins - b.prevWins;
        return b.randomVal - a.randomVal;
      });
      
      return {
        winner: candidates[0],
        allCandidates: candidates
      };
    }

    function getWinnerForMonthCached(bulan) {
      if (_eotmCache[bulan] !== undefined) return _eotmCache[bulan];
      const res = getWinnerForMonth(bulan);
      _eotmCache[bulan] = res ? res.winner.pegawaiId : null;
      return _eotmCache[bulan];
    }

    function getPrevWinsCount(pegawaiId, targetMonth) {
      const allMonths = Array.from(new Set((DATA.penilaian || []).map(p => p.bulan)))
        .filter(b => b < targetMonth)
        .sort();
        
      let wins = 0;
      allMonths.forEach(m => {
        const winnerId = getWinnerForMonthCached(m);
        if (winnerId === pegawaiId) wins++;
      });
      return wins;
    }

    function getDeterministicRandom(empId, bulan) {
      const str = empId + "_" + bulan;
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % 1000;
    }

                        <div style="font-weight: bold; width: 42px;">${c.score.toFixed(1)}</div>
                        <div style="flex:1; background: var(--color-border); height: 6px; border-radius: 3px; min-width:60px">
                          <div style="background: ${isWinner ? "#F59E0B" : "var(--color-primary)"}; width: ${scorePct}%; height: 100%; border-radius: 3px;"></div>
                        </div>
                      </div>
                    </td>
                    <td>${c.reportCount} kegiatan</td>
                    <td>${statusInfo}</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table></div>
        </div>
      `;

      const pastWinnersHtml = [];
      const now = new Date();
      const monthsHistory = [];
      for (let i = 1; i <= 6; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        monthsHistory.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
      }
      
      monthsHistory.forEach(m => {
        const pastRes = getWinnerForMonth(m);
        if (pastRes) {
          const w = pastRes.winner;
          pastWinnersHtml.push(`
            <div class="panel" style="padding:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:240px; flex:1; background:#fff; border-radius:10px; border:1px solid var(--color-border);">
              <div style="display:flex;align-items:center;gap:10px">
                <div class="avatar small" style="background:var(--color-primary-light); width:35px; height:35px; font-size:14px; font-weight:bold; color:#fff;">${esc(w.user.nama.slice(0, 1).toUpperCase())}</div>
                <div>
                  <div style="font-size:10px; font-weight:bold; color:var(--color-primary)">${fmtMonth(m)}</div>
                  <div style="font-weight:600; font-size:12.5px; color:var(--color-text);">${esc(w.user.nama)}</div>
                  <div style="font-size:10px; color:var(--color-text-muted)">Skor: ${w.score.toFixed(1)} | ${w.reportCount} Laporan</div>
                </div>
              </div>
              ${canPrintPiagam ? `<div style="display:flex;gap:4px">
                <button class="icon-btn" title="Buat / Cetak SK EOTM ${fmtMonth(m)}" data-action="open-cetak-sk" data-bulan="${m}">${icon("file-check-2")}</button>
                <button class="icon-btn" title="Cetak Piagam ${fmtMonth(m)}" data-action="open-cetak-piagam" data-bulan="${m}">${icon("printer")}</button>
              </div>` : ""}
            </div>
          `);
        }
      });
      
      const historySection = pastWinnersHtml.length === 0 ? "" : `
        <div style="margin-top:30px">
          <h3 class="panel-title" style="margin-bottom:15px">${icon("history")} Galeri Pemenang Sebelumnya</h3>
          <div style="display:flex; gap:15px; flex-wrap:wrap">
            ${pastWinnersHtml.join("")}
          </div>
        </div>
      `;

      return `
        ${sectionHead("Penghargaan", "Employee of the Month", `Apresiasi pencapaian kinerja terbaik dan penerapan nilai BerAKHLAK pegawai BPS Kabupaten Mempawah periode ${fmtMonth(selBulan)}.`)}
        <div style="margin-bottom:20px">${selectHtml}</div>
        ${heroCard}
        ${leaderboardTable}
        ${historySection}
      `;
    }

    const PIAGAM_CFG_KEY = "bps-piagam-eotm-config-v1";
    function loadPiagamConfig() {
      try {
        return JSON.parse(localStorage.getItem(PIAGAM_CFG_KEY) || "{}") || {};
      } catch (e) { return {}; }
    }
    function savePiagamConfig(cfg) {
      try { localStorage.setItem(PIAGAM_CFG_KEY, JSON.stringify(cfg || {})); } catch (e) {}
    }
    function fmtDateLongId(d) {
      if (!d) return "";
      const dt = new Date(d + "T00:00:00");
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
    }

    function bpsLogoSvg(size) {
      const s = size || 28;
      return `<img src="${BPS_LOGO_DATA_URI}" alt="Logo BPS" style="height:${s}px;width:auto;object-fit:contain;display:inline-block;vertical-align:middle">`;

    function buildPiagamHtml(meta) {
      return `
        <div class="piagam-sheet">
          <div class="piagam-border-outer">
            <div class="piagam-corner tl"></div>
            <div class="piagam-corner tr"></div>
            <div class="piagam-corner bl"></div>
            <div class="piagam-corner br"></div>
            <div class="piagam-border-inner">
              <div>
                <div style="margin-bottom:4px">${bpsLogoSvg(42)}</div>
                <div class="piagam-instansi">Badan Pusat Statistik Kabupaten Mempawah</div>
                <div class="piagam-title">Piagam Penghargaan</div>
                <div class="piagam-nomor">Nomor: ${esc(meta.nomor)}</div>
              </div>

              <div style="max-width:680px">
                <div style="font-size:12.5px;color:#475569;margin-bottom:2px">Diberikan dengan bangga kepada:</div>

                <div class="piagam-recipient-role">${esc(meta.jabatanPenerima)}</div>

                <div style="font-size:12.5px;color:#475569;margin:4px 0">Sebagai apresiasi atas dedikasi, integritas, dan capaian kinerja terbaik sebagai:</div>

                    <div class="piagam-score-item">
                      <div class="piagam-score-label">Indeks BerAKHLAK (40%)</div>

                    </div>
                    <div class="piagam-score-item">
                      <div class="piagam-score-label">Skor Akhir</div>

              <div class="piagam-footer">

    function openPiagamModal(bulan) {
      if (!["penilai", "admin"].includes(CURRENT_USER.role)) {
        showToast("Hanya Kepala / Penilai atau Admin yang dapat mencetak piagam EOTM.", "error");
        return;
      }
      const targetBulan = bulan || STATE.eotmBulan || currentMonthStr();
      const eotmData = getWinnerForMonth(targetBulan);
      if (!eotmData) {
        showToast(`Belum ada pemenang untuk periode ${fmtMonth(targetBulan)}.`, "error");
        return;
      }

      const { winner } = eotmData;
      const saved = loadPiagamConfig();
      const byMonth = (saved.byMonth && saved.byMonth[targetBulan]) || {};
      const [yr, mo] = targetBulan.split("-");
      const defaultNomor = byMonth.nomor || `B-001/61040/KP.650/${mo}/${yr}`;
      const defaultTempatTanggal = byMonth.tempatTanggal || `Mempawah, ${fmtDateLongId(todayStr())}`;
      const defaultJabatanPenerima = byMonth.jabatanPenerima || "Pegawai BPS Kabupaten Mempawah";
      const defaultJabatanKepala = saved.jabatanKepala || "Kepala Badan Pusat Statistik Kabupaten Mempawah";
      const defaultNamaKepala = saved.namaKepala || CURRENT_USER.nama || "";
      const defaultNipKepala = saved.nipKepala || "";

      const kinNum = kinerjaNum(winner.penilaian.nilaiKinerja);
      const kinPred = kinerjaPredikat(kinNum);
      const avgBer = berakhlakAvg(winner.penilaian).toFixed(2);
      const finalSkor = winner.score.toFixed(1);

      const getMetaFromInputs = () => ({
        bulan: targetBulan,
        periodeStr: fmtMonth(targetBulan),
        nomor: (document.getElementById("f-pg-nomor")?.value || defaultNomor).trim(),
        namaPenerima: winner.user.nama,
        jabatanPenerima: (document.getElementById("f-pg-jabatan-penerima")?.value || defaultJabatanPenerima).trim(),
        nilaiKinerja: String(kinNum),
        predikatKinerja: kinPred.label,
        nilaiBerakhlak: avgBer,
        skorAkhir: finalSkor,
        tempatTanggal: (document.getElementById("f-pg-tempat-tanggal")?.value || defaultTempatTanggal).trim(),
        jabatanKepala: (document.getElementById("f-pg-jabatan-kepala")?.value || defaultJabatanKepala).trim(),
        namaKepala: (document.getElementById("f-pg-nama-kepala")?.value || defaultNamaKepala).trim(),
        nipKepala: (document.getElementById("f-pg-nip-kepala")?.value || defaultNipKepala).trim(),
      });

      const initialMeta = {
        bulan: targetBulan,
        periodeStr: fmtMonth(targetBulan),
        nomor: defaultNomor,
        namaPenerima: winner.user.nama,
        jabatanPenerima: defaultJabatanPenerima,
        nilaiKinerja: String(kinNum),
        predikatKinerja: kinPred.label,
        nilaiBerakhlak: avgBer,
        skorAkhir: finalSkor,
        tempatTanggal: defaultTempatTanggal,
        jabatanKepala: defaultJabatanKepala,
        namaKepala: defaultNamaKepala,
        nipKepala: defaultNipKepala,
      };

      const html = `
  <div class="modal-overlay" data-action="overlay-close">
    <div class="modal-box" style="max-width:860px">
      <div class="modal-head">
        <h3>${icon("printer")} Cetak Piagam Employee of the Month (${fmtMonth(targetBulan)})</h3>
        <button class="modal-close" data-action="close-modal">${icon("x")}</button>
      </div>
      <div class="modal-body">
        <div class="modal-hint">
          Penerima penghargaan: <strong>${esc(winner.user.nama)}</strong> &middot; Skor Akhir: <strong>${finalSkor} / 100</strong>. Sesuaikan atribut piagam di bawah ini sebelum mencetak (format <strong>A4 Landscape</strong>).
        </div>

        <div class="row2">
          <label class="field"><span class="field-label">Nomor Piagam</span>
            <input class="input" id="f-pg-nomor" value="${esc(defaultNomor)}"></label>
          <label class="field"><span class="field-label">Tempat &amp; Tanggal Ditetapkan</span>
            <input class="input" id="f-pg-tempat-tanggal" value="${esc(defaultTempatTanggal)}"></label>
        </div>

        <div class="row2">
          <label class="field"><span class="field-label">Jabatan / Tim Penerima</span>
            <input class="input" id="f-pg-jabatan-penerima" value="${esc(defaultJabatanPenerima)}"></label>
          <label class="field"><span class="field-label">Jabatan Penandatangan</span>
            <input class="input" id="f-pg-jabatan-kepala" value="${esc(defaultJabatanKepala)}"></label>
        </div>

        <div class="row2">
          <label class="field"><span class="field-label">Nama Kepala BPS / Penandatangan<span class="req"> *</span></span>
            <input class="input" id="f-pg-nama-kepala" value="${esc(defaultNamaKepala)}" placeholder="Nama lengkap beserta gelar"></label>
          <label class="field"><span class="field-label">NIP Penandatangan</span>
            <input class="input" id="f-pg-nip-kepala" value="${esc(defaultNipKepala)}" placeholder="19xxxxxxxxxxxxxx"></label>
        </div>

        <div class="field-label" style="margin-bottom:6px">Pratinjau Piagam</div>
        <div class="piagam-preview-wrap" id="piagam-live-preview">
          ${buildPiagamHtml(initialMeta)}
        </div>

        <div class="modal-footer">
          <button class="btn-ghost" data-action="close-modal">Tutup</button>
          <button class="btn-primary" data-action="exec-cetak-piagam" data-bulan="${targetBulan}">${icon("printer")} Cetak / Simpan PDF</button>
        </div>
      </div>
    </div>
  </div>`;
      document.getElementById("modal-root").innerHTML = html;
      afterRender();

      const previewEl = document.getElementById("piagam-live-preview");
      ["f-pg-nomor", "f-pg-tempat-tanggal", "f-pg-jabatan-penerima", "f-pg-jabatan-kepala", "f-pg-nama-kepala", "f-pg-nip-kepala"].forEach(inpId => {
        const inp = document.getElementById(inpId);
        if (inp && previewEl) {
          inp.addEventListener("input", () => {
            previewEl.innerHTML = buildPiagamHtml(getMetaFromInputs());
          });
        }
      });
    }

    function printPiagamNow(bulan) {
      const targetBulan = bulan || STATE.eotmBulan || currentMonthStr();
      const eotmData = getWinnerForMonth(targetBulan);
      if (!eotmData) return;
      const { winner } = eotmData;

      const nomor = (document.getElementById("f-pg-nomor")?.value || "").trim();
      const tempatTanggal = (document.getElementById("f-pg-tempat-tanggal")?.value || "").trim();
      const jabatanPenerima = (document.getElementById("f-pg-jabatan-penerima")?.value || "").trim();
      const jabatanKepala = (document.getElementById("f-pg-jabatan-kepala")?.value || "").trim();
      const namaKepala = (document.getElementById("f-pg-nama-kepala")?.value || "").trim();
      const nipKepala = (document.getElementById("f-pg-nip-kepala")?.value || "").trim();

      if (!namaKepala) {
        showToast("Nama Kepala BPS / Penandatangan wajib diisi.", "error");
        return;
      }

      const saved = loadPiagamConfig();
      saved.jabatanKepala = jabatanKepala;
      saved.namaKepala = namaKepala;
      saved.nipKepala = nipKepala;
      saved.byMonth = saved.byMonth || {};
      saved.byMonth[targetBulan] = { nomor, tempatTanggal, jabatanPenerima };
      savePiagamConfig(saved);

      const kinNum = kinerjaNum(winner.penilaian.nilaiKinerja);
      const kinPred = kinerjaPredikat(kinNum);
      const avgBer = berakhlakAvg(winner.penilaian).toFixed(2);
      const finalSkor = winner.score.toFixed(1);

      const printRoot = document.getElementById("print-piagam-root");
      if (!printRoot) return;
      setPrintPageMode("piagam");
      printRoot.innerHTML = buildPiagamHtml({
        bulan: targetBulan,
        periodeStr: fmtMonth(targetBulan),
        nomor,
        namaPenerima: winner.user.nama,
        jabatanPenerima,
        nilaiKinerja: String(kinNum),
        predikatKinerja: kinPred.label,
        nilaiBerakhlak: avgBer,
        skorAkhir: finalSkor,
        tempatTanggal,
        jabatanKepala,
        namaKepala,
        nipKepala,
      });

      setTimeout(() => {
        window.print();
      }, 80);
    }

    function setPrintPageMode(mode) {
      document.body.dataset.printMode = mode;
      let styleEl = document.getElementById("dynamic-print-page-style");
      if (!styleEl) {
        styleEl = document.createElement("style");
        styleEl.id = "dynamic-print-page-style";
        document.head.appendChild(styleEl);
      }

    function printSkEotmNow(bulan) {
      const targetBulan = bulan || STATE.eotmBulan || currentMonthStr();
      const eotmData = getWinnerForMonth(targetBulan);
      if (!eotmData) return;
      const { winner } = eotmData;

      const nomorSk = (document.getElementById("f-sk-nomor")?.value || "").trim();
      const tempatDitetapkan = (document.getElementById("f-sk-tempat")?.value || "").trim();
      const tanggalDitetapkan = (document.getElementById("f-sk-tanggal")?.value || "").trim();
      const nipPenerima = (document.getElementById("f-sk-nip-penerima")?.value || "").trim();
      const jabatanPenerima = (document.getElementById("f-sk-jabatan-penerima")?.value || "").trim();
      const jabatanKepala = (document.getElementById("f-sk-jabatan-kepala")?.value || "").trim();
      const namaKepala = (document.getElementById("f-sk-nama-kepala")?.value || "").trim();
      const nipKepala = (document.getElementById("f-sk-nip-kepala")?.value || "").trim();

      if (!namaKepala) {
        showToast("Nama Kepala BPS / Penandatangan wajib diisi.", "error");
        return;
      }

      const saved = loadPiagamConfig();
      saved.jabatanKepala = jabatanKepala;
      saved.namaKepala = namaKepala;
      saved.nipKepala = nipKepala;
      saved.byMonth = saved.byMonth || {};
      saved.byMonth[targetBulan] = Object.assign({}, saved.byMonth[targetBulan] || {}, {
        nomorSk,
        tempatSk: tempatDitetapkan,
        tanggalSk: tanggalDitetapkan,
        nipPenerima,
        jabatanPenerima
      });
      saved.byEmp = saved.byEmp || {};
      saved.byEmp[winner.pegawaiId] = { nip: nipPenerima, jabatan: jabatanPenerima };
      savePiagamConfig(saved);

      const kinNum = kinerjaNum(winner.penilaian.nilaiKinerja);
      const kinPred = kinerjaPredikat(kinNum);
      const avgBer = berakhlakAvg(winner.penilaian).toFixed(2);
      const finalSkor = winner.score.toFixed(1);

      const printRoot = document.getElementById("print-piagam-root");
      if (!printRoot) return;
      setPrintPageMode("sk");
      printRoot.innerHTML = buildSkEotmHtml({
        bulan: targetBulan,
        periodeStr: fmtMonth(targetBulan),
        nomorSk,
        namaPenerima: winner.user.nama,
        nipPenerima,
        jabatanPenerima,
        nilaiKinerja: String(kinNum),
        predikatKinerja: kinPred.label,
        nilaiBerakhlak: avgBer,
        skorAkhir: finalSkor,
        tempatDitetapkan,
        tanggalDitetapkan,
        jabatanKepala,
        namaKepala,
        nipKepala,
      });

      setTimeout(() => {
        window.print();
      }, 80);
    }

    function renderEotmTicker() {
      const months = Array.from(new Set((DATA.penilaian || []).map(p => p.bulan)))
        .sort((a, b) => b.localeCompare(a))
        .slice(0, 3);
      
      const winners = [];
      months.forEach(m => {
        const res = getWinnerForMonth(m);
        if (res) {
          winners.push({ monthStr: fmtMonth(m), name: res.winner.user.nama, score: res.winner.score });
        }
      });
      
      let tickerText = "";
      if (winners.length > 0) {
        tickerText = winners.map(w => {
          return `🏆 <strong>Employee of The Month ${w.monthStr}</strong>: <span style="color:#FFF3E0;font-weight:600">${esc(w.name)}</span> (Skor Akhir: ${w.score.toFixed(1)}) 🎉`;
        }).join(" &nbsp;&nbsp;&bull;&nbsp;&nbsp; ");
      } else {
        tickerText = `✨ <strong>Selamat Datang di Portal Kinerja BPS Kabupaten Mempawah</strong> &nbsp;&bull;&nbsp; Mari berikan penilaian kinerja terbaik dan nilai karakter BerAKHLAK bulanan pegawai untuk memunculkan Employee of The Month di sini! ⭐`;
      }
      
      const marqueeContent = `<span>${tickerText}</span><span>${tickerText}</span>`;
      
      return `
        <div class="eotm-ticker-container">
          <div class="eotm-ticker-label">⭐ APRESIASI</div>
          <div class="eotm-ticker-viewport">
            <div class="eotm-ticker-track">
              ${marqueeContent}
            </div>
          </div>
        </div>
      `;
    }
